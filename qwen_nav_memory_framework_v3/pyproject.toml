[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-nav-memory-framework"
version = "0.3.0"
description = "Relative-pose topo-metric episodic memory framework for Qwen3-VL navigation supervisors with VLM-grounded place recognition and live latest-node pose relation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Navigation Memory Framework" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "requests>=2.31"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nav_memory_qwen*"]
